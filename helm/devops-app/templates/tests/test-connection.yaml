apiVersion: v1
kind: Pod
metadata:
  name: {{ include "devops-app.fullname" . }}-test
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: {{ .Values.waitForDb.image }}
      command: ["wget", "-qO-", "http://{{ include "devops-app.fullname" . }}-svc:{{ .Values.service.port }}{{ .Values.healthPath }}"]