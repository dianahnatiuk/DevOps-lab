{{- $name := printf "%s-secret" (include "devops-app.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pw := "" -}}
{{- if .Values.postgres.dbPassword -}}
{{- $pw = .Values.postgres.dbPassword -}}
{{- else if and $existing $existing.data -}}
{{- $pw = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- else -}}
{{- $pw = randAlphaNum 20 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pw | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:%v/%s" .Values.postgres.dbUser $pw (include "devops-app.fullname" .) .Values.postgres.port .Values.postgres.dbName | quote }}