{{- if .Values.hooks.preUpgrade.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "devops-app.fullname" . }}-pre-upgrade
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pre-upgrade
          image: {{ .Values.waitForDb.image }}
          command: ["sh", "-c", "echo 'pre-upgrade check: release {{ .Release.Name }}, revision {{ .Release.Revision }}'"]
{{- end }}