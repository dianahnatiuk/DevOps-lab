# Source: devops-app/templates/postgres-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-devops-app-postgres
  labels:
    helm.sh/chart: devops-app-0.1.0
    app.kubernetes.io/name: devops-app
    app.kubernetes.io/instance: prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-app
      app.kubernetes.io/instance: prod
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        helm.sh/chart: devops-app-0.1.0
        app.kubernetes.io/name: devops-app
        app.kubernetes.io/instance: prod
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: "postgres:16"
          ports:
            - name: pg
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: prod-devops-app-config
            - secretRef:
                name: prod-devops-app-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prod-devops-app-postgres-data
---
